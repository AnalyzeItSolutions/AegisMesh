[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triage-service"
version = "0.1.0"
description = "TriageService gRPC server: START classification, duplicate detection, a review queue"
requires-python = ">=3.10"
dependencies = ["grpcio", "protobuf", "h3>=4"]

[project.scripts]
triage-service = "server:serve"

[tool.setuptools]
py-modules = ["server", "dedupe"]
