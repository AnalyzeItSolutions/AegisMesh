syntax = "proto3";
package aegismesh.v1;
option go_package = "github.com/aegismesh/aegismesh/gen/aegismeshv1;aegismeshv1";
import "aegismesh/v1/common.proto";

message DeltaBatch {
  string tenant_id = 1;
  bytes payload = 2;
}

message SyncAck {
  string tenant_id = 1;
  bytes payload = 2;
}

message PullRequest {
  string tenant_id = 1;
  bytes payload = 2;
}

message HashRequest {
  string tenant_id = 1;
  bytes payload = 2;
}

message HashReply {
  string tenant_id = 1;
  bytes payload = 2;
}
service SyncService {
  rpc PushDelta(DeltaBatch) returns (SyncAck);
  rpc PullDelta(PullRequest) returns (DeltaBatch);
  rpc StateHash(HashRequest) returns (HashReply);
}
