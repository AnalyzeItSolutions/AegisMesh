syntax = "proto3";
package aegismesh.v1;
option go_package = "github.com/aegismesh/aegismesh/gen/aegismeshv1;aegismeshv1";
import "aegismesh/v1/common.proto";

message LocationFrame {
  string tenant_id = 1;
  bytes payload = 2;
}

message TelemetryAck {
  string tenant_id = 1;
  bytes payload = 2;
}

message ViewportRequest {
  string tenant_id = 1;
  bytes payload = 2;
}
service TelemetryService {
  rpc Ingest(LocationFrame) returns (TelemetryAck);
  rpc Subscribe(ViewportRequest) returns (LocationFrame);
}
