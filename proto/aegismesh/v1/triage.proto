syntax = "proto3";
package aegismesh.v1;
option go_package = "github.com/aegismesh/aegismesh/gen/aegismeshv1;aegismeshv1";
import "aegismesh/v1/common.proto";

message TriageInput {
  string tenant_id = 1;
  bytes payload = 2;
}

message TriageResult {
  string tenant_id = 1;
  bytes payload = 2;
}

message DuplicateResult {
  string tenant_id = 1;
  bytes payload = 2;
}
service TriageService {
  rpc Classify(TriageInput) returns (TriageResult);
  rpc FindDuplicate(TriageInput) returns (DuplicateResult);
}
