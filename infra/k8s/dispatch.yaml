apiVersion: apps/v1
kind: Deployment
metadata: {name: dispatch}
spec:
  replicas: 2
  selector: {matchLabels: {app: dispatch}}
  template:
    metadata: {labels: {app: dispatch}}
    spec:
      containers:
      - name: dispatch
        image: dispatch:latest
        ports: [{containerPort: 50052}]
        readinessProbe: {tcpSocket: {port: 50052}, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: dispatch}
spec:
  selector: {app: dispatch}
  ports: [{port: 50052, targetPort: 50052}]
