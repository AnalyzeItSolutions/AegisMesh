apiVersion: apps/v1
kind: Deployment
metadata: {name: triage}
spec:
  replicas: 2
  selector: {matchLabels: {app: triage}}
  template:
    metadata: {labels: {app: triage}}
    spec:
      containers:
      - name: triage
        image: triage:latest
        ports: [{containerPort: 50055}]
        readinessProbe: {tcpSocket: {port: 50055}, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: triage}
spec:
  selector: {app: triage}
  ports: [{port: 50055, targetPort: 50055}]
