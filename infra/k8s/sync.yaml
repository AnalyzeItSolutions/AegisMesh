apiVersion: apps/v1
kind: Deployment
metadata: {name: sync}
spec:
  replicas: 2
  selector: {matchLabels: {app: sync}}
  template:
    metadata: {labels: {app: sync}}
    spec:
      containers:
      - name: sync
        image: sync:latest
        ports: [{containerPort: 50051}]
        readinessProbe: {tcpSocket: {port: 50051}, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: sync}
spec:
  selector: {app: sync}
  ports: [{port: 50051, targetPort: 50051}]
