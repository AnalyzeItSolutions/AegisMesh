apiVersion: apps/v1
kind: Deployment
metadata: {name: telemetry}
spec:
  replicas: 2
  selector: {matchLabels: {app: telemetry}}
  template:
    metadata: {labels: {app: telemetry}}
    spec:
      containers:
      - name: telemetry
        image: telemetry:latest
        ports: [{containerPort: 50054}]
        readinessProbe: {tcpSocket: {port: 50054}, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: telemetry}
spec:
  selector: {app: telemetry}
  ports: [{port: 50054, targetPort: 50054}]
