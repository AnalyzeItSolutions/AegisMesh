apiVersion: apps/v1
kind: Deployment
metadata: {name: routing}
spec:
  replicas: 2
  selector: {matchLabels: {app: routing}}
  template:
    metadata: {labels: {app: routing}}
    spec:
      containers:
      - name: routing
        image: routing:latest
        ports: [{containerPort: 50053}]
        readinessProbe: {tcpSocket: {port: 50053}, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: routing}
spec:
  selector: {app: routing}
  ports: [{port: 50053, targetPort: 50053}]
