admin: {address: {socket_address: {address: 0.0.0.0, port_value: 9901}}}
static_resources:
  listeners:
  - name: ingress
    address: {socket_address: {address: 0.0.0.0, port_value: 8080}}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress
          route_config:
            name: local
            virtual_hosts:
            - name: all
              domains: ['*']
              routes:
              - match: {prefix: "/SyncService/"}
                route: {cluster: sync}
              - match: {prefix: "/DispatchService/"}
                route: {cluster: dispatch}
              - match: {prefix: "/RoutingService/"}
                route: {cluster: routing}
              - match: {prefix: "/TelemetryService/"}
                route: {cluster: telemetry}
              - match: {prefix: "/TriageService/"}
                route: {cluster: triage}
          http_filters:
          - name: envoy.filters.http.local_ratelimit
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
              stat_prefix: rl
              token_bucket: {max_tokens: 200, tokens_per_fill: 200, fill_interval: 1s}
              filter_enabled: {runtime_key: rl_on, default_value: {numerator: 100, denominator: HUNDRED}}
              filter_enforced: {runtime_key: rl_enf, default_value: {numerator: 100, denominator: HUNDRED}}
          - name: envoy.filters.http.router
            typed_config: {"@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router}
  clusters:
  - name: sync
    type: LOGICAL_DNS
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config: {http2_protocol_options: {}}
    load_assignment:
      cluster_name: sync
      endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: host.docker.internal, port_value: 50051}}}}]}]
  - name: dispatch
    type: LOGICAL_DNS
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config: {http2_protocol_options: {}}
    load_assignment:
      cluster_name: dispatch
      endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: host.docker.internal, port_value: 50052}}}}]}]
  - name: routing
    type: LOGICAL_DNS
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config: {http2_protocol_options: {}}
    load_assignment:
      cluster_name: routing
      endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: host.docker.internal, port_value: 50053}}}}]}]
  - name: telemetry
    type: LOGICAL_DNS
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config: {http2_protocol_options: {}}
    load_assignment:
      cluster_name: telemetry
      endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: host.docker.internal, port_value: 50054}}}}]}]
  - name: triage
    type: LOGICAL_DNS
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config: {http2_protocol_options: {}}
    load_assignment:
      cluster_name: triage
      endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: host.docker.internal, port_value: 50055}}}}]}]
