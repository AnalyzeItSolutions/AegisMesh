services:
  postgres:
    build: ./infra/postgres
    environment: {POSTGRES_PASSWORD: dev, POSTGRES_DB: app}
    ports: ['5432:5432']
    healthcheck: {test: ['CMD-SHELL', 'pg_isready -U postgres'], interval: 3s, timeout: 3s, retries: 20}
    volumes: ['./db/migrations:/docker-entrypoint-initdb.d:ro']
  timescale:
    image: timescale/timescaledb:latest-pg16
    environment: {POSTGRES_PASSWORD: dev, POSTGRES_DB: telemetry}
    ports: ['5433:5432']
    healthcheck: {test: ['CMD-SHELL', 'pg_isready -U postgres'], interval: 3s, timeout: 3s, retries: 20}
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck: {test: ['CMD', 'redis-cli', 'ping'], interval: 3s, timeout: 3s, retries: 20}
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    command: [redpanda, start, --mode, dev-container, --smp, '1', --memory, 1G, --overprovisioned, --kafka-addr, 'PLAINTEXT://0.0.0.0:9092', --advertise-kafka-addr, 'PLAINTEXT://localhost:9092']
    ports: ['9092:9092']
    healthcheck: {test: ['CMD-SHELL', 'rpk cluster health | grep -q "Healthy:.*true"'], interval: 5s, timeout: 5s, retries: 30}
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: [start-dev, --import-realm]
    environment: {KEYCLOAK_ADMIN: admin, KEYCLOAK_ADMIN_PASSWORD: admin}
    ports: ['8081:8080']
    volumes: ['./infra/keycloak:/opt/keycloak/data/import:ro']
  envoy:
    image: envoyproxy/envoy:v1.30-latest
    volumes: ['./infra/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro']
    ports: ['8080:8080', '9901:9901']
  vault:
    image: hashicorp/vault:1.16
    command: [server, -dev, -dev-root-token-id=dev]
    cap_add: [IPC_LOCK]
    ports: ['8200:8200']
